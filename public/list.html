<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Λίστα Αξιολογήσεων</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      max-width: 100%;
      margin: 0 auto;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      table-layout: fixed;
      word-wrap: normal;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    /* Filter input styles */
    .filters input {
      width: 90%;
      padding: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }

    th {
      background-color: #007bff;
      color: #fff;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #e9ecef;
    }

    .button {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      margin: 0 0px;
    }

    .button-edit, .button-excel, .button-delete {
      background-color: #ffffff;
      color: #333; /* Default text color for better contrast */
    }

    .button-edit:hover, .button-excel:hover, .button-delete:hover {
      background-color: #acacac;
    }

    .top-buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .top-buttons a {
      text-decoration: none;
      padding: 8px 15px;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      font-weight: bold;
    }

    .top-buttons a:hover {
      background-color: #0056b3;
    }

    /* Error Message Styling */
    .error-message {
      text-align: center;
      padding: 20px;
      color: red;
      font-weight: bold;
      border: 1px solid red;
      background-color: #fff5f5;
      margin-top: 20px;
    }

    /* Loading Spinner */
    .loader {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Λίστα αξιολογήσεων</h1>

    <div class="top-buttons">
      <a href="index.html">🏠 Αρχική</a>
      <a href="add.html">➕ Προσθήκη</a>
      <a href="due.html">⏳ Προθεσμίες</a>
    </div>

    <div id="counter" style="margin: 10px 0; font-weight: bold;">Εγγραφές: 0
    </div>
    
    <!-- Error Message Container -->
    <div id="error-container" class="error-message" style="display:none;"></div>

    <!-- Loading Spinner (Optional) -->
    <div id="loader" class="loader" style="display:none;">Φόρτωση...</div>

    <table id="recordsTable">
      <colgroup>
        <col style="width: 5%;"> 
        <col style="width: 5%;"> 
        <col style="width: 6%;"> 
        <col style="width: 20%;"> 
        <col style="width: 20%;"> 
        <col style="width: 20%;"> 
        <col style="width: 5%;"> 
        <col style="width: 5%;"> 
        <col style="width: 5%;"> 
        <col style="width: 10%;"> 
      </colgroup>
      <thead>
        <tr>
          <th>Α/Α</th>
          <th>A/Α e-adeies</th>
          <th>Ημερομηνία</th>
          <th>Επωνυμία</th>
          <th>Είδος δραστηριότητας</th>
          <th>Οδός</th>
          <th>Αξ. 1ου</th>
          <th>Αξ. 2ου</th>
          <th>Αξ. 3ου</th>
          <th>Ενέργειες</th>
        </tr>
        <tr class="filters">
          <th><input type="text" placeholder="Α/Α" /></th>
          <th><input type="text" placeholder="A/Α e-adeies" /></th>
          <th><input type="text" placeholder="Ημερομηνία" /></th>
          <th><input type="text" placeholder=" Επωνυμία" /></th>
          <th><input type="text" placeholder="Είδος δραστηριότητας" /></th>
          <th><input type="text" placeholder="Οδός" /></th>
          <th><input type="text" placeholder="Αξ. 1ου" /></th>
          <th><input type="text" placeholder="Αξ. 2ου" /></th>
          <th><input type="text" placeholder="Αξ. 3ου" /></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be populated by JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // --- SECURITY FIX: HTML Escaping Utility ---
    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // --- PERFORMANCE FIX: Debounce Function ---
    // Prevents applyFilters from running on every single keystroke
    let debounceTimeout;
    const DEBOUNCE_DELAY = 300; // Wait 300ms after user stops typing

    // --- APPLICATION LOGIC STARTS HERE ---

    const filterInputs = document.querySelectorAll('.filters input');

    // 1. Restore Filters on Page Load (Before Loading Data)
    function restoreFilters() {
      if (!filterInputs.length) return;
      
      filterInputs.forEach((input, index) => {
        const saved = sessionStorage.getItem(`filter_${index}`);
        if (saved !== null) {
          input.value = saved;
        }
      });
    }

    // 2. Load Records (With Error Handling)
    async function loadRecords() {
      const tbody = document.querySelector('#recordsTable tbody');
      const counterEl = document.getElementById('counter');
      const loaderEl = document.getElementById('loader');
      
      // Reset Table and UI states
      if(tbody) tbody.innerHTML = ""; 
      if(loaderEl) loaderEl.style.display = 'block';
      if(counterEl) counterEl.textContent = "Εγγραφές: Φορτίζονται...";

      try {
        const res = await fetch('/api/axiologiseis');

        if (!res.ok) {
            throw new Error(`Server returned ${res.status}`);
        }

        const records = await res.json();

        updateCounter(records.length);

        let html = "";

        // 3. Security FIX: Escape all data before inserting into DOM
        records.forEach(record => {
          html += `
            <tr>
              <td>${escapeHtml(record.id)}</td>
              <td>${escapeHtml(record.aa_aitisis) || ''}</td>
              <td>${escapeHtml(record.imnia)}</td>
              <td class="wrap">${escapeHtml(record.eponimia)}</td>
              <td class="wrap">${escapeHtml(record.eidos_drast)}</td>
              <td>${escapeHtml(record.odos)}, Δ. ${escapeHtml(record.perioxi)}</td>
              <td>${escapeHtml(record.axiologisi_lvl1) || ''}</td>
              <td>${escapeHtml(record.axiologisi_lvl2) || ''}</td>
              <td>${escapeHtml(record.axiologisi_lvl3) || ''}</td>
              <td>
                <button class="button button-edit" 
                        onclick="editRecord(${record.id})" 
                        aria-label="Edit Record"
                        title="Επεξεργασία">🖊️</button>
                <button class="button button-excel" 
                        onclick="exportToExcel(${record.id})" 
                        aria-label="Export to Excel"
                        title="Εξαγωγή σε Excel">📋</button>
                <button class="button button-delete" 
                        onclick="deleteRecord(${record.id})" 
                        aria-label="Delete Record"
                        title="Διαγραφή">❌</button>
              </td>
            </tr>`;
        });

        tbody.innerHTML = html;
        
      } catch (error) {
        // 4. Error Handling FIX: Gracefully handle API failures
        console.error("Load Records Error:", error);
        const errorContainer = document.getElementById('error-container');
        if(errorContainer) {
          errorContainer.style.display = 'block';
          errorContainer.textContent = `❌ Σφάλμα Φόρτωσης:\n${error.message || ''}`;
        } else {
            // Fallback UI for error
            const tbody = document.querySelector('#recordsTable tbody');
            if(tbody) tbody.innerHTML = `<tr><td colspan="10" style="text-align:center">❌ Σφάλμα API. Ελέγξτε τη σύνδεση.</td></tr>`;
        }
      } finally {
          // Hide loader
          if(loaderEl) loaderEl.style.display = 'none';
      }
    }

    function editRecord(id) {
      window.location.href = `edit.html?id=${id}`;
    }

    async function deleteRecord(id) {
      if (confirm('Επιθυμείτε να διαγράψετε την εγγραφή?')) {
        try {
            const res = await fetch(`/api/axiologiseis/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadRecords(); // Reload table after delete
            } else {
                alert('Failed to delete record');
            }
        } catch (error) {
            console.error("Delete failed:", error);
            alert('Error deleting record: ' + error.message);
        }
      }
    }

    function exportToExcel(id) {
      window.open(`/api/axiologiseis/${id}/excel`, "_blank");
    }

    function updateCounter(count) {
      const counter = document.getElementById('counter');
      if (counter) {
        counter.textContent = `Εγγραφές: ${count}`;
      }
    }

    // 5. Filter Logic with Debouncing and Session Storage
    function applyFilters() {
      if (!filterInputs.length) return;

      const rows = document.querySelectorAll('#recordsTable tbody tr');
      let visibleCount = 0;

      rows.forEach(row => {
        let show = true;

        filterInputs.forEach((input, colIndex) => {
          // Check bounds to prevent accessing invalid cell if column count changes
          if(colIndex >= row.cells.length) return; 

          const filterValue = input.value.trim().toLowerCase();
          if (!filterValue) return; 

          const cell = row.cells[colIndex];
          const text = (cell?.textContent || '').toLowerCase();

          if (!text.includes(filterValue)) {
            show = false;
          }
        });

        row.style.display = show ? '' : 'none';
        if (show) visibleCount++;
      });

      updateCounter(visibleCount);
    }

    // Setup Event Listeners for Filters
    filterInputs.forEach((input, index) => {
      input.addEventListener('keyup', () => {
        // Save to session storage immediately so it survives refresh
        const key = `filter_${index}`;
        sessionStorage.setItem(key, input.value);

        // Debounce the applyFilters call for performance
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(applyFilters, DEBOUNCE_DELAY);
      });
    });

    // Initialize Application
    document.addEventListener('DOMContentLoaded', () => {
        restoreFilters(); // Restore previous session filters
        loadRecords();    // Load initial data
    });

  </script>

</body>

</html>
